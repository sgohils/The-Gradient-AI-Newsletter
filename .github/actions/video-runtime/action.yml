name: Free CPU video runtime
description: Pinned Kokoro dependencies and cached model files; FFmpeg on Linux
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: |
          scripts/video/requirements.txt
          scripts/video/constraints.txt
    - uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface/hub
        key: kokoro-cpu-f3ff3571791e39611d31c381e3a41a3af07b4987-${{ runner.os }}
    - shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
        python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r scripts/video/requirements.txt
