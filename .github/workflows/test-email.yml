name: Test Newsletter Email

on:
  workflow_dispatch:
    inputs:
      to:
        description: 'Recipient email'
        required: true
        default: 'jingkoole@gmail.com'
      date:
        description: 'Issue date to send (YYYY-MM-DD)'
        required: true
        default: '2026-07-28'

jobs:
  send-test-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Send test email
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAILER_FROM_EMAIL: newsletter@gradientnews.app
          MAILER_FROM_NAME: The Gradient
          NEWSLETTER_BASE_URL: https://gradientnews.app
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const { loadConfig } = require('./dist/src/config');
            const { buildNewsletterHtml, buildNewsletterText, sendEmail } = require('./dist/src/mailer');

            const date = '${{ inputs.date }}';
            const to = '${{ inputs.to }}';
            const postsDir = path.join(process.cwd(), 'posts');
            const mdPath = path.join(postsDir, date + '.md');

            console.log('Looking for issue at:', mdPath);
            console.log('CWD:', process.cwd());
            console.log('Posts dir exists:', fs.existsSync(postsDir));
            console.log('MD file exists:', fs.existsSync(mdPath));

            if (!fs.existsSync(mdPath)) {
              console.error('Issue file not found:', mdPath);
              process.exit(1);
            }

            const raw = fs.readFileSync(mdPath, 'utf-8');
            console.log('File content preview:', raw.substring(0, 500));

            const frontmatterMatch = raw.match(/^---\n([\s\S]*?)\n---/);
            const content = raw.replace(/^---\n[\s\S]*?\n---\n/, '');

            let title = date;
            let tags = [];

            if (frontmatterMatch) {
              const fm = frontmatterMatch[1];
              const titleMatch = fm.match(/title:\s*\"([^\"]*)\"/);
              const tagsMatch = fm.match(/tags:\n([\s\S]*?)(?=\n\w|\n---|$)/);

              if (titleMatch) title = titleMatch[1];
              if (tagsMatch) {
                tags = tagsMatch[1]
                  .split('\n')
                  .map(line => line.replace(/^\s*-\s*/, '').trim())
                  .filter(Boolean);
              }
            }

            console.log('Parsed title:', title);
            console.log('Parsed tags:', tags);

            const articles = [];
            const articleRegex = /^##\s+(.+)$/gm;
            const linkRegex = /\[Read more\]\(([^)]+)\)/;
            let match;
            const headings = [];

            while ((match = articleRegex.exec(content)) !== null) {
              headings.push({ title: match[1].trim(), index: match.index });
            }

            console.log('Found headings:', headings.length);

            for (let i = 0; i < headings.length; i++) {
              const sectionStart = headings[i].index;
              const sectionEnd = i + 1 < headings.length ? headings[i + 1].index : content.length;
              const section = content.slice(sectionStart, sectionEnd);

              const urlMatch = section.match(linkRegex);
              const url = urlMatch ? urlMatch[1] : '';
              const textBeforeLink = section.replace(linkRegex, '').trim().replace(/^##\s+.+$/m, '').trim();

              articles.push({
                id: date + '-' + i,
                title: headings[i].title,
                url,
                description: textBeforeLink,
                publishedAt: new Date(date),
                sourceId: 'unknown',
                sourceName: 'unknown',
              });
            }

            const introMatch = content.match(/^(.*?)(?=##\s|$)/s);
            const intro = introMatch ? introMatch[1].trim() : '';

            console.log('Parsed intro:', intro.substring(0, 200));
            console.log('Parsed articles:', articles.length);

            const issue = {
              id: 'gradient-' + date,
              title,
              date,
              intro,
              articles,
              tags,
              featuredImageUrl: undefined,
            };

            const config = loadConfig();
            console.log('Resend API key present:', !!config.mailer.resendApiKey);

            if (!config.mailer.resendApiKey) {
              console.error('RESEND_API_KEY is not set');
              process.exit(1);
            }

            const html = buildNewsletterHtml(issue);
            const text = buildNewsletterText(issue);
            const baseUrl = process.env.NEWSLETTER_BASE_URL || 'https://gradientnews.app';
            const unsubscribeUrl = (email, token) =>
              baseUrl + '/api/unsubscribe?email=' + encodeURIComponent(email) + '&token=' + encodeURIComponent(token);

            const personalizedHtml = html.replace(/{{unsubscribe_url}}/g, unsubscribeUrl(to, 'test-token'));
            const personalizedText = text.replace(/{{unsubscribe_url}}/g, unsubscribeUrl(to, 'test-token'));

            console.log('Sending email to:', to);
            console.log('Subject:', issue.title);
            console.log('HTML length:', personalizedHtml.length);
            console.log('Text length:', personalizedText.length);

            sendEmail({
              to: [to],
              subject: issue.title,
              html: personalizedHtml,
              text: personalizedText,
            }).then(() => {
              console.log('Email sent to', to);
            }).catch((err) => {
              console.error('Failed to send email:', err);
              process.exit(1);
            });
          "
