name: Daily Newsletter Publisher

on:
  schedule:
    # Target 7 AM Eastern throughout DST; retries stay off the busy hour boundary.
    - cron: "0 7 * * *"
      timezone: America/New_York
    - cron: "17,37 7-11 * * *"
      timezone: America/New_York
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Optional YYYY-MM-DD to recover; reuses an existing newsletter without emailing again'
        default: ''

concurrency:
  group: gradient-daily-pipeline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      video_input: ${{ steps.newsletter.outputs.video_input || steps.preflight.outputs.video_input }}
      issue_date: ${{ steps.preflight.outputs.issue_date }}
      video_needed: ${{ steps.preflight.outputs.video_needed }}
      newsletter_available: ${{ steps.linkedin_source.outputs.available }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A delayed/queued retry must see earlier runs' committed issue files.
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build pipeline
        run: npm run build

      - name: Check today's completed work
        id: preflight
        env:
          ISSUE_DATE: ${{ inputs.issue_date }}
          VIDEO_ENABLED: ${{ vars.VIDEO_ENABLED }}
          VIDEO_PUBLISH_ENABLED: ${{ vars.VIDEO_PUBLISH_ENABLED }}
        run: node dist/scripts/daily-status.js

      - name: Run publisher
        id: newsletter
        if: steps.preflight.outputs.newsletter_needed == 'true'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OUTPUT_DIR: posts
          DAILY_ISSUE_DATE: ${{ steps.preflight.outputs.issue_date }}
          NEWSLETTER_BASE_URL: ${{ vars.NEWSLETTER_BASE_URL }}
        run: npm run publish

      - name: Commit and push new issue
        if: steps.preflight.outputs.newsletter_needed == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          git diff --cached --quiet || git commit -m "chore: publish daily newsletter issue"
          git push

      - name: Check LinkedIn source edition
        id: linkedin_source
        env:
          ISSUE_DATE: ${{ steps.preflight.outputs.issue_date }}
        shell: bash
        run: |
          if [ -s "posts/$ISSUE_DATE.md" ] && [ -s "posts/$ISSUE_DATE.html" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retain newsletter video input
        if: steps.newsletter.outputs.video_input != '' || steps.preflight.outputs.video_input != ''
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-input
          path: ${{ steps.newsletter.outputs.video_input || steps.preflight.outputs.video_input }}
          retention-days: 7
          if-no-files-found: error

  linkedin:
    needs: publish
    if: needs.publish.outputs.newsletter_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ISSUE_DATE: ${{ needs.publish.outputs.issue_date }}
      NEWSLETTER_BASE_URL: ${{ vars.NEWSLETTER_BASE_URL }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ vars.ZERNIO_LINKEDIN_ACCOUNT_ID }}
      ZERNIO_LINKEDIN_ORGANIZATION_URN: ${{ vars.ZERNIO_LINKEDIN_ORGANIZATION_URN }}
      LINKEDIN_PUBLISH_ENABLED: ${{ vars.LINKEDIN_PUBLISH_ENABLED }}
      LINKEDIN_STATE_GIT_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare or publish today's LinkedIn company Page post
        run: node dist/scripts/linkedin.js --automatic
      - name: Retain LinkedIn preview and recovery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-linkedin-output
          path: |
            linkedin-output/
            linkedin-state/
          retention-days: 7
          if-no-files-found: warn

  video:
    # Serialize Git state writers; a LinkedIn failure must not suppress video.
    needs: [publish, linkedin]
    if: always() && needs.publish.result == 'success' && vars.VIDEO_ENABLED == 'true' && needs.publish.outputs.video_input != '' && needs.publish.outputs.video_needed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ vars.ZERNIO_YOUTUBE_ACCOUNT_ID || secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
      NEWSLETTER_BASE_URL: ${{ vars.NEWSLETTER_BASE_URL }}
      VIDEO_LEDGER_GIT_SYNC: '1'
      ISSUE_DATE: ${{ needs.publish.outputs.issue_date }}
    steps:
      # Read the latest newsletter commit and publication ledger, not the trigger SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@v4
        with:
          name: daily-video-input
          path: video-input
      - name: Reconcile pending provider posts
        if: vars.VIDEO_PUBLISH_ENABLED == 'true'
        run: node dist/scripts/video-publish.js --reconcile-only

      - name: Check publication after reconciliation
        id: preflight
        env:
          VIDEO_ENABLED: ${{ vars.VIDEO_ENABLED }}
          VIDEO_PUBLISH_ENABLED: ${{ vars.VIDEO_PUBLISH_ENABLED }}
        run: node dist/scripts/daily-status.js
      - uses: ./.github/actions/video-runtime
        if: steps.preflight.outputs.video_needed == 'true'
      - name: Render today's story
        id: render
        if: steps.preflight.outputs.video_needed == 'true'
        run: node dist/scripts/video-render.js --input "video-input/$ISSUE_DATE.video.json"
      - name: Publish YouTube Short
        if: vars.VIDEO_PUBLISH_ENABLED == 'true' && steps.render.outputs.status == 'ready'
        env:
          MANIFEST: ${{ steps.render.outputs.manifest }}
        shell: bash
        run: node dist/scripts/video-publish.js --manifest "$MANIFEST" --platforms youtube
      - name: Persist selected story and final platform states
        if: always()
        run: node -e 'const {gitCheckpoint}=require("./dist/src/video/cli"); gitCheckpoint("video-state/ledger.json")().catch(e=>{console.error(e.message);process.exitCode=1})'
      - name: Retain video and recovery ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-output
          path: |
            video-output/
            video-state/ledger.json
          retention-days: 7
