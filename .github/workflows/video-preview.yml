name: Video preview and activation check
on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'YYYY-MM-DD already in posts, or sample for a fictional preview'
        required: true
        default: sample
      publish:
        description: 'Publish a real issue immediately (sample is always rejected)'
        type: boolean
        default: false
      tiktok:
        description: 'Also publish TikTok; requires the exact video consent receipt'
        type: boolean
        default: false
      source_run_id:
        description: 'Optional prior preview/daily run ID; publish its exact reviewed artifact'
        default: ''
concurrency:
  group: gradient-daily-pipeline
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ISSUE_DATE: ${{ inputs.issue_date }}
      DO_PUBLISH: ${{ inputs.publish }}
      DO_TIKTOK: ${{ inputs.tiktok }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ vars.ZERNIO_YOUTUBE_ACCOUNT_ID }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ vars.ZERNIO_TIKTOK_ACCOUNT_ID }}
      VIDEO_LEDGER_GIT_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: ./.github/actions/video-runtime
      - name: Restore the exact reviewed video
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          pattern: '*video*'
          merge-multiple: true
          path: restored-video
      - name: Render selected issue
        id: render
        shell: bash
        run: |
          if [ -d restored-video/video-output ]; then
            node -e 'const fs=require("fs"),path=require("path"),s=require("./dist/src/video/storage");s.assertIssueDate(process.env.ISSUE_DATE);const p=path.resolve("restored-video/video-output",process.env.ISSUE_DATE,"manifest.json"),m=s.readManifest(p);if(m.issueDate!==process.env.ISSUE_DATE)throw Error("Issue mismatch");fs.appendFileSync(process.env.GITHUB_OUTPUT,"manifest="+p+"\nstatus="+m.status+"\n")'
          elif [ "$ISSUE_DATE" = sample ]; then
            node dist/scripts/video-sample.js --output-dir video-output/sample
          else
            node -e 'require("./dist/src/video/storage").assertIssueDate(process.env.ISSUE_DATE)'
            node dist/scripts/video-render.js --input "posts/$ISSUE_DATE.video.json"
          fi
      - name: Publish activation check
        if: inputs.publish
        env:
          MANIFEST: ${{ steps.render.outputs.manifest }}
        shell: bash
        run: |
          platforms=youtube
          approval=()
          if [ "$DO_TIKTOK" = true ]; then
            platforms=youtube,tiktok
            if [ -f "video-state/approvals/$ISSUE_DATE.json" ]; then
              approval=(--tiktok-approval "video-state/approvals/$ISSUE_DATE.json")
            fi
          fi
          node dist/scripts/video-publish.js --manifest "$MANIFEST" --platforms "$platforms" "${approval[@]}"
      - name: Persist video ledger
        if: always()
        run: node -e 'const {gitCheckpoint}=require("./dist/src/video/cli"); gitCheckpoint("video-state/ledger.json")().catch(e=>{console.error(e.message);process.exitCode=1})'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-preview
          path: |
            video-output/
            restored-video/video-output/
            video-state/ledger.json
          retention-days: 7
