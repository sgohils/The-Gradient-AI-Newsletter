name: Video preview and activation check
on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'YYYY-MM-DD already in posts, or sample for a fictional preview'
        required: true
        default: sample
      publish:
        description: 'Publish a real issue immediately (sample is always rejected)'
        type: boolean
        default: false
      tiktok:
        description: 'Also publish TikTok; requires the exact video consent receipt'
        type: boolean
        default: false
      source_run_id:
        description: 'Optional prior preview/daily run ID; publish its exact reviewed artifact'
        default: ''
concurrency:
  group: gradient-daily-pipeline
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  video:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ISSUE_DATE: ${{ inputs.issue_date }}
      DO_PUBLISH: ${{ inputs.publish }}
      DO_TIKTOK: ${{ inputs.tiktok }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ vars.ZERNIO_YOUTUBE_ACCOUNT_ID }}
      ZERNIO_TIKTOK_ACCOUNT_ID: ${{ vars.ZERNIO_TIKTOK_ACCOUNT_ID }}
      VIDEO_LEDGER_GIT_SYNC: '1'
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Restore the exact reviewed video
        if: inputs.source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}
          pattern: '*video*'
          merge-multiple: true
          path: restored-video
      - name: Prepare and validate the video source
        id: source
        shell: bash
        run: |
          args=(--issue-date "$ISSUE_DATE")
          if [ -n "$SOURCE_RUN_ID" ]; then
            args+=(--restored-dir restored-video)
          fi
          node dist/scripts/video-prepare.js "${args[@]}"
      - uses: ./.github/actions/video-runtime
        if: steps.source.outputs.mode != 'restored'
      - name: Render selected issue
        id: render
        env:
          VIDEO_MODE: ${{ steps.source.outputs.mode }}
          VIDEO_INPUT: ${{ steps.source.outputs.video_input }}
          REVIEWED_MANIFEST: ${{ steps.source.outputs.manifest }}
          REVIEWED_STATUS: ${{ steps.source.outputs.status }}
        shell: bash
        run: |
          if [ "$VIDEO_MODE" = restored ]; then
            printf 'manifest=%s\nstatus=%s\n' "$REVIEWED_MANIFEST" "$REVIEWED_STATUS" >> "$GITHUB_OUTPUT"
          elif [ "$VIDEO_MODE" = sample ]; then
            node dist/scripts/video-sample.js --output-dir video-output/sample
          else
            node dist/scripts/video-render.js --input "$VIDEO_INPUT"
          fi
      - name: Publish activation check
        if: inputs.publish && steps.render.outputs.status == 'ready'
        env:
          MANIFEST: ${{ steps.render.outputs.manifest }}
        shell: bash
        run: |
          platforms=youtube
          approval=()
          if [ "$DO_TIKTOK" = true ]; then
            platforms=youtube,tiktok
            if [ -f "video-state/approvals/$ISSUE_DATE.json" ]; then
              approval=(--tiktok-approval "video-state/approvals/$ISSUE_DATE.json")
            fi
          fi
          node dist/scripts/video-publish.js --manifest "$MANIFEST" --platforms "$platforms" "${approval[@]}"
      - name: Persist video ledger
        if: always()
        run: node -e 'const {gitCheckpoint}=require("./dist/src/video/cli"); gitCheckpoint("video-state/ledger.json")().catch(e=>{console.error(e.message);process.exitCode=1})'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-preview
          path: |
            video-output/
            video-state/ledger.json
            ${{ steps.source.outputs.video_input }}
          retention-days: 7
