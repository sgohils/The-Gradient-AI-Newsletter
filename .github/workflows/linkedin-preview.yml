name: LinkedIn preview and activation check

on:
  workflow_dispatch:
    inputs:
      issue_date:
        description: 'Optional YYYY-MM-DD; defaults to today (UTC). New posts require the current edition.'
        default: ''
      publish:
        description: 'Publish this edition to the configured LinkedIn company Page'
        type: boolean
        default: false
      inspect_accounts:
        description: 'List connected LinkedIn account and company Page IDs only; creates no post'
        type: boolean
        default: false

# Shares the lock with the newsletter and video workflows that push state.
concurrency:
  group: gradient-daily-pipeline
  cancel-in-progress: false

jobs:
  linkedin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      ISSUE_DATE: ${{ inputs.issue_date }}
      NEWSLETTER_BASE_URL: ${{ vars.NEWSLETTER_BASE_URL }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      ZERNIO_LINKEDIN_ACCOUNT_ID: ${{ vars.ZERNIO_LINKEDIN_ACCOUNT_ID }}
      ZERNIO_LINKEDIN_ORGANIZATION_URN: ${{ vars.ZERNIO_LINKEDIN_ORGANIZATION_URN }}
      LINKEDIN_PUBLISH_ENABLED: ${{ inputs.publish && 'true' || 'false' }}
      LINKEDIN_STATE_GIT_SYNC: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Inspect connected LinkedIn accounts and Page IDs
        if: inputs.inspect_accounts
        run: node dist/scripts/zernio-accounts.js
      - name: Prepare or publish the LinkedIn company Page post
        if: ${{ !inputs.inspect_accounts }}
        run: node dist/scripts/linkedin.js --automatic
      - name: Retain preview and recovery state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-preview
          path: |
            linkedin-output/
            linkedin-state/
          retention-days: 7
          if-no-files-found: warn
