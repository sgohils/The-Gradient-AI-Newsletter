name: Project checks

on:
  push:
    branches: [main]
    paths-ignore: ['posts/**', 'video-state/**']
  pull_request:
    paths-ignore: ['posts/**', 'video-state/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shorts-setup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Test existing YouTube and analytics connections
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          ZERNIO_YOUTUBE_ACCOUNT_ID: ${{ vars.ZERNIO_YOUTUBE_ACCOUNT_ID || secrets.ZERNIO_YOUTUBE_ACCOUNT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_ID: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_ID }}
          YOUTUBE_ANALYTICS_CLIENT_SECRET: ${{ secrets.YOUTUBE_ANALYTICS_CLIENT_SECRET }}
          YOUTUBE_ANALYTICS_REFRESH_TOKEN: ${{ secrets.YOUTUBE_ANALYTICS_REFRESH_TOKEN }}
        run: node dist/scripts/video-setup.js
      - uses: actions/upload-artifact@v4
        with:
          name: shorts-setup-checks
          path: video-output/setup/connections.json
          retention-days: 7
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  website:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: web/test-results/

  video-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/video-runtime
      - name: Check caption layout with the runner fonts
        run: python -m unittest discover -s scripts/video -p 'test_*.py'
      - name: Render a complete offline sample
        id: sample
        run: npm run video:sample -- --output-dir video-output/sample
      - name: Check encoded media and audio
        env:
          SAMPLE_DIRECTORY: ${{ steps.sample.outputs.directory }}
        run: python scripts/video/verify.py --directory "$SAMPLE_DIRECTORY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-smoke-sample
          path: video-output/sample/
          retention-days: 7
